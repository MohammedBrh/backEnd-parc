server.port=8080

# Embedded H2 database stored in ./data (relative to where the jar is started). Backup = copy this folder.
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_parc_auto
spring.datasource.username=root
spring.datasource.password=123456789
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Demo data is inserted only when the database is empty. Set to false in production.
fleet.seed-demo=true
